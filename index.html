<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>進捗管理ボード</title>
    <link rel="stylesheet" href="app.css">
    <script src="app.js" defer></script>
</head>

<body>
    <header class="app-bar">
        <h1>進捗管理ボード</h1>
    </header>

    <main class="container">
        <!-- 新規追加フォーム -->
        <section class="card">
            <h2>新規タスクを追加</h2>
            <form id="taskForm" class="task-form">
                <div class="field">
                    <label for="taskName">タスク名 <span class="required" aria-hidden="true">必須</span></label>
                    <input type="text" id="taskName" name="taskName" placeholder="例）API設計ドキュメントを書く" autocomplete="off"
                        required>
                </div>
                <div class="field">
                    <label for="taskDue">期限</label>
                    <input type="date" id="taskDue" name="taskDue">
                </div>
                <div class="field">
                    <label for="taskStatus">ステータス</label>
                    <select id="taskStatus" name="taskStatus">
                        <option value="未対応">未対応</option>
                        <option value="処理中">処理中</option>
                        <option value="完了">完了</option>
                    </select>
                </div>
                <button type="submit" id="addButton">追加</button>
            </form>
        </section>

        <!-- タスク一覧 -->
        <section class="card">
            <div class="list-header">
                <h2>タスク一覧</h2>
                <p id="summary" class="summary" aria-live="polite"></p>
            </div>

            <!-- カラム見出し -->
            <div class="task-list-head" aria-hidden="true">
                <span class="task-name">タスク名</span>
                <span class="task-due">期限</span>
                <span class="task-status-col">ステータス</span>
                <span class="task-action-col">操作</span>
            </div>

            <ul id="taskList" class="task-list">

                <!-- 1行の構造（JSで生成する見本。実際の生成は app.js で行う）: -->
                <!-- <li class="task-item">
                    <span class="task-name">タスク名</span>
                    <span class="task-due">2026/07/15</span>
                    <select class="task-status"> …未対応/処理中/完了… </select>
                    <button type="button" class="deleteButton" aria-label="削除">
                        <img src="trash.svg" alt="" class="icon">
                    </button>
                </li> -->

            </ul>

            <!-- タスクが0件のときの表示 -->
            <p id="emptyState" class="empty-state" hidden>
                まだタスクがありません。上のフォームから追加してください。
            </p>
        </section>
    </main>
</body>

</html>
